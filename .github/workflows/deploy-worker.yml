name: Deploy AI worker to Modal

# Deploys worker/modal_app.py. The worker's own keys live in the Modal secret
# "viralking-secrets" (created in the Modal dashboard), not in GitHub.
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "After deploying, run the talking-avatar self-test (about $0.10 of GPU time)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r worker/requirements.txt
      - run: modal deploy worker/modal_app.py
      - if: ${{ inputs.smoke_test }}
        run: modal run worker/modal_app.py::talk_smoke
      # Voice preview clips for the Voice menu (CPU, skips any that already exist).
      - run: modal run worker/modal_app.py::make_voice_samples
