name: Voice video smoke test (temporary)

# Runs only on the voice-video branch. Uses `modal run` (a temporary app), so the live worker is untouched.
on:
  push:
    branches: [voice-video]
    paths: ["worker/**", ".github/workflows/voice-smoke.yml"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r worker/requirements.txt pillow
      - run: modal run worker/modal_app.py::voice_smoke
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper
      - name: Check the clip (streams, loudness, what is said, contact sheet)
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,sample_rate:format=duration -of compact voice-smoke.mp4
          ffmpeg -i voice-smoke.mp4 -af ebur128 -f null - 2>&1 | grep -E "^\s+I:" | tail -1
          python -c "from faster_whisper import WhisperModel; m=WhisperModel('small', device='cpu', compute_type='int8'); s,_=m.transcribe('voice-smoke.mp4'); print('HEARD:', ' '.join(x.text for x in s))"
          ffmpeg -v error -y -i voice-smoke.mp4 -vf "fps=2,scale=200:-1,tile=5x2" -frames:v 1 -q:v 5 sheet.jpg
          echo "SHEET_B64_START"; base64 -w0 sheet.jpg; echo; echo "SHEET_B64_END"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-smoke
          path: voice-smoke.mp4
          retention-days: 2
