name: tmp start job 3
on:
  push:
    branches: [tmp-start-job3]
jobs:
  start:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - run: modal run tmp/upload.py
      - run: python -c "import modal; modal.Cls.from_name('viralking-ai','ScriptWriter')().run.spawn('2f287b0e-d66a-45b8-a44f-118629d1a538'); print('started')"
